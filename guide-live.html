<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guide Live</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Announcement Bar -->
<script src="https://elfsightcdn.com/platform.js" async></script>
<div class="elfsight-app-870b2bb1-06e5-4e12-a4df-0c0c5cfca09a"></div>

<header>
  <h1>🌘 Guide Live</h1>
</header>

<main>

  <section class="live-status">
    <h2 id="eclipsePhase">Waiting for Eclipse...</h2>
  </section>

  <section class="timers">

    <div class="timer">
      <h3>Time Until Start</h3>
      <p id="startTimer">--:--:--</p>
    </div>

    <div class="timer">
      <h3>Time Until Maximum Eclipse</h3>
      <p id="maxTimer">--:--:--</p>
    </div>

    <div class="timer">
      <h3>Time Until End</h3>
      <p id="endTimer">--:--:--</p>
    </div>

  </section>

</main>

<script src="guide-live.js"></script>
</body>
</html>
