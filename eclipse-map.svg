<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="UK eclipse path map for 12 August 2026">
  <defs>
    <!-- Space background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060914"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>

    <!-- Eclipse shadow: darkest at top (totality zone), lightest at south -->
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.82"/>
      <stop offset="18%"  stop-color="#000000" stop-opacity="0.65"/>
      <stop offset="40%"  stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="65%"  stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="85%"  stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Land base fill -->
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#152238"/>
      <stop offset="100%" stop-color="#1c2d48"/>
    </linearGradient>

    <!-- Glow filter for totality band and cities -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="300" height="420" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="22"  cy="18"  r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="55"  cy="8"   r="0.6" fill="#fff" opacity="0.5"/>
  <circle cx="88"  cy="22"  r="0.9" fill="#fff" opacity="0.6"/>
  <circle cx="135" cy="12"  r="0.7" fill="#fff" opacity="0.55"/>
  <circle cx="198" cy="6"   r="0.8" fill="#fff" opacity="0.65"/>
  <circle cx="240" cy="18"  r="0.6" fill="#fff" opacity="0.5"/>
  <circle cx="275" cy="10"  r="0.9" fill="#fff" opacity="0.6"/>
  <circle cx="265" cy="38"  r="0.7" fill="#fff" opacity="0.4"/>
  <circle cx="12"  cy="55"  r="0.6" fill="#fff" opacity="0.5"/>
  <circle cx="285" cy="72"  r="0.8" fill="#fff" opacity="0.55"/>
  <circle cx="42"  cy="38"  r="0.5" fill="#fff" opacity="0.4"/>
  <circle cx="165" cy="28"  r="0.6" fill="#fff" opacity="0.45"/>
  <circle cx="295" cy="45"  r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="8"   cy="95"  r="0.7" fill="#fff" opacity="0.4"/>
  <circle cx="292" cy="120" r="0.6" fill="#fff" opacity="0.45"/>
  <circle cx="295" cy="200" r="0.5" fill="#fff" opacity="0.35"/>
  <circle cx="8"   cy="180" r="0.6" fill="#fff" opacity="0.4"/>
  <circle cx="4"   cy="260" r="0.7" fill="#fff" opacity="0.35"/>
  <circle cx="296" cy="280" r="0.5" fill="#fff" opacity="0.3"/>
  <circle cx="5"   cy="340" r="0.6" fill="#fff" opacity="0.25"/>

  <!-- ── NORTHERN IRELAND ── -->
  <path d="M 52,158 C 62,146 80,140 96,146 C 108,152 112,166 100,175 C 86,182 66,178 55,168 Z"
        fill="url(#land)" stroke="#2e4f7a" stroke-width="0.8"/>

  <!-- ── IRELAND (partial, visible on left) ── -->
  <path d="M 18,190 C 22,165 28,145 42,132 C 55,120 65,128 65,148 C 65,162 56,170 52,180 C 46,195 42,215 38,235 C 34,252 28,268 22,278 C 15,268 12,252 14,232 C 15,215 16,205 18,190 Z"
        fill="#0e1c30" stroke="#1e3455" stroke-width="0.8" opacity="0.7"/>

  <!-- ── SCOTLAND ── -->
  <path d="M 88,192
           C 80,172 72,148 68,125
           C 64,102 68,80 78,68
           C 88,58 102,50 118,44
           C 135,38 152,40 168,50
           C 182,60 190,78 188,98
           C 186,115 175,125 162,134
           C 150,138 138,138 128,146
           C 112,148 100,152 92,162
           C 90,178 88,186 88,192 Z"
        fill="url(#land)" stroke="#2e4f7a" stroke-width="0.8"/>

  <!-- ── ENGLAND + WALES ── -->
  <path d="M 92,162
           C 100,152 112,148 128,146
           C 138,138 150,138 162,134
           C 174,130 186,122 192,128
           C 205,138 212,158 216,180
           C 220,202 220,228 218,252
           C 216,276 210,298 202,318
           C 194,336 184,350 170,360
           C 156,368 140,366 130,352
           C 124,340 126,320 122,300
           C 118,278 110,256 105,233
           C 102,216 102,196 100,178
           C 98,164 94,160 92,162 Z"
        fill="url(#land)" stroke="#2e4f7a" stroke-width="0.8"/>

  <!-- ── ECLIPSE SHADOW OVERLAY (penumbra darkening) ── -->
  <!-- Applied after land so it dims the land correctly -->
  <path d="M 88,192
           C 80,172 72,148 68,125
           C 64,102 68,80 78,68
           C 88,58 102,50 118,44
           C 135,38 152,40 168,50
           C 182,60 190,78 188,98
           C 186,115 175,125 162,134
           C 150,138 138,138 128,146
           C 112,148 100,152 92,162
           C 90,178 88,186 88,192 Z"
        fill="url(#shadow)" opacity="0.85"/>

  <path d="M 52,158 C 62,146 80,140 96,146 C 108,152 112,166 100,175 C 86,182 66,178 55,168 Z"
        fill="url(#shadow)" opacity="0.75"/>

  <path d="M 92,162
           C 100,152 112,148 128,146
           C 138,138 150,138 162,134
           C 174,130 186,122 192,128
           C 205,138 212,158 216,180
           C 220,202 220,228 218,252
           C 216,276 210,298 202,318
           C 194,336 184,350 170,360
           C 156,368 140,366 130,352
           C 124,340 126,320 122,300
           C 118,278 110,256 105,233
           C 102,216 102,196 100,178
           C 98,164 94,160 92,162 Z"
        fill="url(#shadow)" opacity="0.8"/>

  <!-- ── TOTALITY PATH BAND ── -->
  <!-- Glow layer -->
  <path d="M 0,68 C 60,62 120,60 200,66 C 240,68 270,70 300,72"
        fill="none" stroke="#ff8c00" stroke-width="28" stroke-opacity="0.12" filter="url(#glow)"/>
  <!-- Inner band -->
  <path d="M 0,68 C 60,62 120,60 200,66 C 240,68 270,70 300,72"
        fill="none" stroke="#ff8c00" stroke-width="16" stroke-opacity="0.20"/>
  <!-- Dashed centreline -->
  <path d="M 0,68 C 60,62 120,60 200,66 C 240,68 270,70 300,72"
        fill="none" stroke="#ffb347" stroke-width="2" stroke-opacity="0.85"
        stroke-dasharray="9,5" filter="url(#softglow)"/>
  <!-- Totality label -->
  <text x="105" y="56" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700"
        fill="#ffb347" filter="url(#textShadow)" text-anchor="middle">PATH OF TOTALITY</text>

  <!-- ── COVERAGE ZONE DIVIDERS (subtle lines) ── -->
  <!-- 95% zone (approx 57°N, y≈131) -->
  <line x1="68" y1="130" x2="190" y2="128" stroke="rgba(255,200,50,0.15)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- 90% zone (approx 55°N, y≈165) -->
  <line x1="92" y1="163" x2="192" y2="158" stroke="rgba(255,200,50,0.12)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- 85% zone (approx 53°N, y≈226) -->
  <line x1="98" y1="226" x2="220" y2="220" stroke="rgba(255,200,50,0.10)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- 80% zone (approx 51.5°N, y≈278) -->
  <line x1="100" y1="278" x2="225" y2="272" stroke="rgba(255,200,50,0.08)" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ── CITY MARKERS ── -->
  <!-- Colour: orange-red = near totality, yellow = high partial, pale = lower partial -->

  <!-- Inverness — 99%, near totality -->
  <circle cx="122" cy="118" r="5.5" fill="#ff6a00" opacity="0.95" filter="url(#softglow)"/>
  <circle cx="122" cy="118" r="3"   fill="#ffcc44"/>
  <text x="132" y="122" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700"
        fill="#ffcc44" filter="url(#textShadow)">Inverness 99%</text>

  <!-- Aberdeen — 98% -->
  <circle cx="170" cy="128" r="4.5" fill="#ff7a00" opacity="0.9" filter="url(#softglow)"/>
  <circle cx="170" cy="128" r="2.5" fill="#ffcc44"/>
  <text x="178" y="132" font-family="system-ui,sans-serif" font-size="9" font-weight="600"
        fill="#ffcc44" filter="url(#textShadow)">Aberdeen 98%</text>

  <!-- Glasgow — 97% -->
  <circle cx="122" cy="168" r="4.5" fill="#ff8c00" opacity="0.9" filter="url(#softglow)"/>
  <circle cx="122" cy="168" r="2.5" fill="#ffd700"/>
  <text x="76" y="166" font-family="system-ui,sans-serif" font-size="9" font-weight="600"
        fill="#ffd700" filter="url(#textShadow)" text-anchor="end">97% Glasgow</text>

  <!-- Edinburgh — 96% -->
  <circle cx="145" cy="165" r="4.5" fill="#ff8c00" opacity="0.9" filter="url(#softglow)"/>
  <circle cx="145" cy="165" r="2.5" fill="#ffd700"/>
  <text x="155" y="162" font-family="system-ui,sans-serif" font-size="9" font-weight="600"
        fill="#ffd700" filter="url(#textShadow)">Edinburgh 96%</text>

  <!-- Belfast — 91% -->
  <circle cx="76" cy="186" r="4"   fill="#ff9500" opacity="0.85" filter="url(#softglow)"/>
  <circle cx="76" cy="186" r="2"   fill="#ffd700"/>
  <text x="65" y="198" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600"
        fill="#ffd700" filter="url(#textShadow)" text-anchor="middle">Belfast 91%</text>

  <!-- Newcastle — 93% -->
  <circle cx="181" cy="196" r="4"   fill="#ff9500" opacity="0.85" filter="url(#softglow)"/>
  <circle cx="181" cy="196" r="2"   fill="#ffd700"/>
  <text x="189" y="200" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600"
        fill="#ffd700" filter="url(#textShadow)">Newcastle 93%</text>

  <!-- Manchester — 89% -->
  <circle cx="167" cy="241" r="4"   fill="#ffaa00" opacity="0.85" filter="url(#softglow)"/>
  <circle cx="167" cy="241" r="2"   fill="#ffe066"/>
  <text x="125" y="245" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600"
        fill="#ffe066" filter="url(#textShadow)" text-anchor="end">89% Manchester</text>

  <!-- Leeds — 90% -->
  <circle cx="182" cy="231" r="3.5" fill="#ffaa00" opacity="0.8" filter="url(#softglow)"/>
  <circle cx="182" cy="231" r="2"   fill="#ffe066"/>
  <text x="190" y="234" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600"
        fill="#ffe066" filter="url(#textShadow)">Leeds 90%</text>

  <!-- Birmingham — 85% -->
  <circle cx="175" cy="272" r="4"   fill="#ffbb00" opacity="0.80" filter="url(#softglow)"/>
  <circle cx="175" cy="272" r="2"   fill="#fff088"/>
  <text x="183" y="276" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600"
        fill="#fff088" filter="url(#textShadow)">Birmingham 85%</text>

  <!-- Cardiff — 81% -->
  <circle cx="136" cy="303" r="3.5" fill="#ffcc00" opacity="0.75" filter="url(#softglow)"/>
  <circle cx="136" cy="303" r="2"   fill="#fff4aa"/>
  <text x="118" y="313" font-family="system-ui,sans-serif" font-size="8.5" font-weight="500"
        fill="#fff4aa" filter="url(#textShadow)" text-anchor="middle">Cardiff 81%</text>

  <!-- London — 82% -->
  <circle cx="214" cy="302" r="4"   fill="#ffcc00" opacity="0.75" filter="url(#softglow)"/>
  <circle cx="214" cy="302" r="2"   fill="#fff4aa"/>
  <text x="222" y="306" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600"
        fill="#fff4aa" filter="url(#textShadow)">London 82%</text>

  <!-- Plymouth — 77% -->
  <circle cx="118" cy="337" r="3.5" fill="#ffdd44" opacity="0.65" filter="url(#softglow)"/>
  <circle cx="118" cy="337" r="2"   fill="#fff9cc"/>
  <text x="125" y="341" font-family="system-ui,sans-serif" font-size="8" font-weight="500"
        fill="#fff9cc" filter="url(#textShadow)">Plymouth 77%</text>

  <!-- ── COMPASS ROSE (small, bottom-right) ── -->
  <g transform="translate(270,370)">
    <circle cx="0" cy="0" r="14" fill="rgba(0,0,0,0.5)" stroke="rgba(255,140,0,0.3)" stroke-width="0.8"/>
    <text x="0"  y="-8"  font-family="system-ui,sans-serif" font-size="7" font-weight="800"
          fill="#ff8c00" text-anchor="middle">N</text>
    <text x="0"  y="12"  font-family="system-ui,sans-serif" font-size="6" font-weight="700"
          fill="rgba(255,255,255,0.5)" text-anchor="middle">S</text>
    <text x="10" y="3"   font-family="system-ui,sans-serif" font-size="6" font-weight="700"
          fill="rgba(255,255,255,0.5)" text-anchor="middle">E</text>
    <text x="-10" y="3"  font-family="system-ui,sans-serif" font-size="6" font-weight="700"
          fill="rgba(255,255,255,0.5)" text-anchor="middle">W</text>
  </g>

  <!-- ── LEGEND ── -->
  <rect x="4" y="372" width="225" height="44" rx="6"
        fill="rgba(0,0,0,0.65)" stroke="rgba(255,140,0,0.2)" stroke-width="0.8"/>

  <!-- Legend title -->
  <text x="12" y="385" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700"
        fill="rgba(255,255,255,0.7)">Eclipse Coverage at Maximum (19:10 BST)</text>

  <!-- Gradient bar -->
  <defs>
    <linearGradient id="legGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff6a00"/>
      <stop offset="50%"  stop-color="#ffbb00"/>
      <stop offset="100%" stop-color="#fff4aa"/>
    </linearGradient>
  </defs>
  <rect x="12" y="392" width="150" height="7" rx="3.5" fill="url(#legGrad)"/>
  <text x="12"  y="410" font-family="system-ui,sans-serif" font-size="7.5" fill="#ff8c00" font-weight="700">~99% N.Scotland</text>
  <text x="162" y="410" font-family="system-ui,sans-serif" font-size="7.5" fill="#fff4aa" font-weight="600" text-anchor="end">~77% S.England</text>

  <!-- Totality legend item -->
  <line x1="170" y1="395" x2="192" y2="395" stroke="#ffb347" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="196" y="398" font-family="system-ui,sans-serif" font-size="7.5" fill="#ffb347" font-weight="700">Totality path</text>
  <text x="196" y="408" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.45)">(NW Scotland)</text>
</svg>
